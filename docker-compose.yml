services:
  # API
  backend:
    build: 
      context: ./backend  
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env              
    volumes:
      - ./chroma_db:/app/chroma_db  
      - ./temp:/app/temp            

  # FRONTEND
  frontend:
    build:
      context: ./frontend 
    container_name: rag-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000 
    depends_on:
      - backend  
    
    command: streamlit run app.py --server.enableCORS=false --server.enableXsrfProtection=false --server.address=0.0.0.0